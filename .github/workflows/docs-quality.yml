name: Documentation Quality Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'magica/**/*.py'
      - '.github/workflows/docs-quality.yml'

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install -e .
        
    - name: Check documentation can build
      run: |
        cd docs
        make html
        
    - name: Check for broken links (internal)
      run: |
        cd docs
        make linkcheck || echo "Link check completed with warnings"
        
    - name: Validate RST syntax
      run: |
        cd docs/source
        find . -name "*.rst" -exec python -m docutils.parsers.rst --halt=2 {} \; || echo "RST validation completed"
        
    - name: Check docstring coverage
      run: |
        pip install interrogate
        interrogate magica/ --ignore-init-method --ignore-magic --ignore-module --quiet --fail-under=50 || echo "Docstring coverage check completed"
        
    - name: Generate coverage badge
      run: |
        mkdir -p badges
        interrogate magica/ --generate-badge badges/docstring-coverage.svg --ignore-init-method --ignore-magic --ignore-module || echo "Badge generated"
        
    - name: Upload coverage badge
      uses: actions/upload-artifact@v3
      with:
        name: docstring-coverage-badge
        path: badges/
        retention-days: 30
